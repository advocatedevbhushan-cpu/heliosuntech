<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2633"/>
      <stop offset="50%" stop-color="#2D3A4D"/>
      <stop offset="100%" stop-color="#161D26"/>
    </linearGradient>
    <radialGradient id="pelletGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="320" rx="16" fill="#0E1217"/>
  <path d="M 40 0 V 320 M 120 0 V 320 M 200 0 V 320 M 280 0 V 320 M 360 0 V 320 M 440 0 V 320" stroke="#1E2633" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 0 60 H 480 M 0 120 H 480 M 0 180 H 480 M 0 240 H 480" stroke="#1E2633" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Extruder Feed Hopper -->
  <polygon points="50,40 120,40 100,110 70,110" fill="#1C2430" stroke="#475569" stroke-width="2"/>
  <text x="85" y="32" font-family="'Space Grotesk', monospace" font-size="10" fill="#8E9AA8" text-anchor="middle">FEED HOPPER</text>

  <!-- Extruder Barrel with Twin Screw & Heating Zones -->
  <rect x="60" y="110" width="260" height="60" rx="6" fill="url(#barrelGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Heat Zones Indicator -->
  <rect x="90" y="114" width="35" height="10" rx="2" fill="#00E599" opacity="0.6"/>
  <rect x="135" y="114" width="35" height="10" rx="2" fill="#00E599" opacity="0.8"/>
  <rect x="180" y="114" width="35" height="10" rx="2" fill="#00B4D8" opacity="0.8"/>
  <rect x="225" y="114" width="35" height="10" rx="2" fill="#00E599" opacity="0.9"/>
  <rect x="270" y="114" width="35" height="10" rx="2" fill="#00E599"/>

  <!-- Twin Screw Helical Flights Graphic -->
  <path d="M 70 140 Q 90 125 110 140 T 150 140 T 190 140 T 230 140 T 270 140 T 310 140" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 70 140 Q 90 155 110 140 T 150 140 T 190 140 T 230 140 T 270 140 T 310 140" stroke="#64748B" stroke-width="3" fill="none"/>

  <!-- Die Head & Strand Pelletizer -->
  <polygon points="320,120 345,130 345,150 320,160" fill="#243042" stroke="#00E599" stroke-width="1.8"/>
  <line x1="345" y1="135" x2="380" y2="135" stroke="#00E599" stroke-width="2.5"/>
  <line x1="345" y1="140" x2="380" y2="140" stroke="#00B4D8" stroke-width="2.5"/>
  <line x1="345" y1="145" x2="380" y2="145" stroke="#00E599" stroke-width="2.5"/>

  <!-- Underwater / Strand Rotating Cutter -->
  <circle cx="395" cy="140" r="18" fill="#161D26" stroke="#00E599" stroke-width="1.8"/>
  <line x1="395" y1="124" x2="395" y2="156" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="379" y1="140" x2="411" y2="140" stroke="#F8FAFC" stroke-width="2"/>

  <!-- Formed High-Purity Polymer Granules Array -->
  <g transform="translate(360, 180)">
    <circle cx="20" cy="20" r="6.5" fill="#00E599"/>
    <circle cx="38" cy="22" r="6" fill="#00B4D8"/>
    <circle cx="56" cy="18" r="6.5" fill="#00E599"/>
    <circle cx="75" cy="24" r="6" fill="#00E599"/>
    
    <circle cx="28" cy="40" r="6.5" fill="#F8FAFC"/>
    <circle cx="48" cy="38" r="6" fill="#00E599"/>
    <circle cx="68" cy="42" r="6.5" fill="#00B4D8"/>

    <circle cx="35" cy="58" r="6" fill="#00E599"/>
    <circle cx="58" cy="56" r="6.5" fill="#00E599"/>
  </g>

  <!-- Technical Labels -->
  <text x="70" y="200" font-family="'Space Grotesk', monospace" font-size="11" fill="#F8FAFC" font-weight="700">EXTRUSION &amp; HOMOGENIZATION</text>
  <text x="70" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8E9AA8">Vacuum degassing and fine melt filtration</text>

  <rect x="360" y="260" width="105" height="24" rx="4" fill="#161D26" stroke="#00E599"/>
  <text x="412" y="276" font-family="'Space Grotesk', monospace" font-size="9" fill="#00E599" text-anchor="middle">UNIFORM GRANULES</text>
</svg>
