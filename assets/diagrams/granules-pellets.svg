<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="barrelGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF4EE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2EFE7"/>
    </linearGradient>

    <style><![CDATA[
      /* Self-contained animations for Recycled Granules Pelletizing */
      @keyframes spin-cutter {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes screw-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes strand-pulse {
        0% { stroke-dashoffset: 16; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pellet-drop {
        0% { transform: translateY(-15px) translateX(-5px); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translateY(35px) translateX(10px); opacity: 0; }
      }
      @keyframes heat-glow {
        0%, 100% { opacity: 0.6; fill: #D97706; }
        50% { opacity: 1; fill: #F59E0B; filter: drop-shadow(0 0 4px #F59E0B); }
      }

      .pellet-cutter-rotor {
        transform-origin: 395px 140px;
        animation: spin-cutter 1.5s linear infinite;
      }
      .screw-flight-a {
        stroke-dasharray: 18 10;
        animation: screw-flow 1.4s linear infinite;
      }
      .screw-flight-b {
        stroke-dasharray: 18 10;
        animation: screw-flow 1.4s linear infinite 0.7s;
      }
      .polymer-strand {
        stroke-dasharray: 8 4;
        animation: strand-pulse 0.6s linear infinite;
      }
      .heat-zone-indicator {
        animation: heat-glow 1.2s infinite alternate ease-in-out;
      }
      .dropping-pellet-1 {
        animation: pellet-drop 1.1s linear infinite;
      }
      .dropping-pellet-2 {
        animation: pellet-drop 1.3s linear infinite 0.3s;
      }
      .dropping-pellet-3 {
        animation: pellet-drop 1.2s linear infinite 0.6s;
      }
    ]]></style>
  </defs>

  <rect width="480" height="320" rx="16" fill="#FFFFFF"/>
  <rect x="1" y="1" width="478" height="318" rx="15" stroke="#E2EFE7" stroke-width="1.5"/>

  <!-- Extruder Feed Hopper -->
  <polygon points="50,40 120,40 100,110 70,110" fill="#F4FAF6" stroke="#146B44" stroke-width="2"/>
  <text x="85" y="32" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#146B44" text-anchor="middle">FEED HOPPER</text>
  
  <!-- Inbound raw flakes in hopper -->
  <polygon points="75,55 85,50 88,60 78,63" fill="#52B216"/>
  <polygon points="90,62 102,58 98,70 87,68" fill="#146B44"/>
  <polygon points="80,80 92,76 90,88 78,86" fill="#68C924"/>

  <!-- Extruder Barrel with Twin Screw & Heating Zones -->
  <rect x="60" y="110" width="260" height="60" rx="6" fill="url(#barrelGradLight)" stroke="#146B44" stroke-width="2"/>
  
  <!-- Heat Zones Indicator (Thermal Heating Bands) -->
  <rect x="90" y="114" width="35" height="8" rx="2" class="heat-zone-indicator"/>
  <rect x="135" y="114" width="35" height="8" rx="2" class="heat-zone-indicator" style="animation-delay: 0.2s;"/>
  <rect x="180" y="114" width="35" height="8" rx="2" class="heat-zone-indicator" style="animation-delay: 0.4s;"/>
  <rect x="225" y="114" width="35" height="8" rx="2" class="heat-zone-indicator" style="animation-delay: 0.6s;"/>
  <rect x="270" y="114" width="35" height="8" rx="2" class="heat-zone-indicator" style="animation-delay: 0.8s;"/>

  <!-- Twin Screw Helical Flights Graphic (Animated Conveying Waves) -->
  <path d="M 70 140 Q 90 125 110 140 T 150 140 T 190 140 T 230 140 T 270 140 T 310 140" stroke="#146B44" stroke-width="3" fill="none" class="screw-flight-a"/>
  <path d="M 70 140 Q 90 155 110 140 T 150 140 T 190 140 T 230 140 T 270 140 T 310 140" stroke="#52B216" stroke-width="3" fill="none" class="screw-flight-b"/>

  <!-- Die Head & Strand Pelletizer -->
  <polygon points="320,120 345,130 345,150 320,160" fill="#EAF4EE" stroke="#146B44" stroke-width="1.8"/>
  
  <!-- Molten Polymer Strands Streaming to Cutter (Animated Dashed Strands) -->
  <line x1="345" y1="135" x2="385" y2="135" stroke="#52B216" stroke-width="3" class="polymer-strand"/>
  <line x1="345" y1="140" x2="385" y2="140" stroke="#146B44" stroke-width="3" class="polymer-strand"/>
  <line x1="345" y1="145" x2="385" y2="145" stroke="#68C924" stroke-width="3" class="polymer-strand"/>

  <!-- Rotating High-Speed Pelletizing Cutter (Spinning Rotor) -->
  <g class="pellet-cutter-rotor">
    <circle cx="395" cy="140" r="22" fill="#F4FAF6" stroke="#146B44" stroke-width="2.2"/>
    <line x1="395" y1="118" x2="395" y2="162" stroke="#146B44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="373" y1="140" x2="417" y2="140" stroke="#146B44" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="395" cy="140" r="8" fill="#FFFFFF" stroke="#52B216" stroke-width="2"/>
    <circle cx="395" cy="125" r="3" fill="#52B216"/>
    <circle cx="410" cy="140" r="3" fill="#146B44"/>
  </g>

  <!-- Newly Cut Granules Dropping from Cutter -->
  <g class="dropping-pellet-1">
    <circle cx="405" cy="165" r="5" fill="#52B216"/>
  </g>
  <g class="dropping-pellet-2">
    <circle cx="415" cy="170" r="5.5" fill="#146B44"/>
  </g>
  <g class="dropping-pellet-3">
    <circle cx="395" cy="172" r="5" fill="#68C924"/>
  </g>

  <!-- Formed Calibrated Granules Array in Collection Bin -->
  <rect x="360" y="195" width="95" height="65" rx="8" fill="#F4FAF6" stroke="#146B44" stroke-width="1.5"/>
  <g transform="translate(365, 205)">
    <circle cx="15" cy="15" r="5.5" fill="#52B216"/>
    <circle cx="32" cy="17" r="5" fill="#146B44"/>
    <circle cx="50" cy="13" r="5.5" fill="#52B216"/>
    <circle cx="68" cy="19" r="5" fill="#68C924"/>
    
    <circle cx="22" cy="32" r="5.5" fill="#146B44"/>
    <circle cx="40" cy="30" r="5" fill="#52B216"/>
    <circle cx="58" cy="34" r="5.5" fill="#1A8253"/>

    <circle cx="30" cy="46" r="5" fill="#52B216"/>
    <circle cx="48" cy="45" r="5.5" fill="#68C924"/>
  </g>

  <!-- Labels & Specs -->
  <text x="60" y="210" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#0A221A">TWIN-SCREW COMPOUNDING &amp; PELLETIZING</text>
  <text x="60" y="228" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#3B584C">CONTINUOUS MELT-FILTRATION • MFI CALIBRATED</text>

  <!-- Spec Tag -->
  <rect x="24" y="276" width="165" height="26" rx="4" fill="#F4FAF6" stroke="#146B44"/>
  <circle cx="36" cy="289" r="4" fill="#52B216" class="heat-zone-indicator"/>
  <text x="46" y="293" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#146B44">GRANULES: ASTM D1238</text>
</svg>
