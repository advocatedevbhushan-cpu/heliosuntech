<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="rollerGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EFE7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCECE2"/>
    </linearGradient>
    <linearGradient id="filmWebLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B216"/>
      <stop offset="35%" stop-color="#146B44"/>
      <stop offset="70%" stop-color="#52B216"/>
      <stop offset="100%" stop-color="#146B44"/>
    </linearGradient>

    <style><![CDATA[
      /* Self-contained animations for Film Extrusion */
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes film-flow {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes corona-spark {
        0%, 100% { opacity: 0.2; transform: scaleY(0.7); }
        50% { opacity: 1; transform: scaleY(1.15); filter: drop-shadow(0 0 4px #52B216); }
      }
      @keyframes bubble-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }

      .roller-1 {
        transform-origin: 120px 140px;
        animation: spin-cw 3.5s linear infinite;
      }
      .roller-2 {
        transform-origin: 170px 100px;
        animation: spin-ccw 2.8s linear infinite;
      }
      .roller-3 {
        transform-origin: 230px 160px;
        animation: spin-cw 3s linear infinite;
      }
      .roller-4 {
        transform-origin: 300px 115px;
        animation: spin-ccw 2.8s linear infinite;
      }
      .roller-winder {
        transform-origin: 410px 160px;
        animation: spin-cw 4.5s linear infinite;
      }
      .animated-film-path {
        stroke-dasharray: 16 8;
        animation: film-flow 1.2s linear infinite;
      }
      .animated-film-glow {
        stroke-dasharray: 8 24;
        animation: film-flow 0.8s linear infinite;
      }
      .corona-beam {
        transform-origin: 300px 75px;
        animation: corona-spark 0.35s infinite alternate ease-in-out;
      }
      .extruder-melt {
        animation: bubble-pulse 1.8s infinite ease-in-out;
      }
    ]]></style>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="320" rx="16" fill="#FFFFFF"/>
  <rect x="1" y="1" width="478" height="318" rx="15" stroke="#E2EFE7" stroke-width="1.5"/>

  <!-- T-Die Extruder Unit -->
  <polygon points="45,60 95,60 85,100 55,100" fill="#F4FAF6" stroke="#146B44" stroke-width="1.8"/>
  <rect x="62" y="100" width="16" height="8" fill="#52B216" class="extruder-melt"/>
  <text x="70" y="50" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#146B44" text-anchor="middle">T-DIE EXTRUSION</text>

  <!-- Extruded Molten Resin Curtain (Flowing downward) -->
  <path d="M 64 108 L 68 126 M 70 108 L 72 126 M 76 108 L 74 126" stroke="#52B216" stroke-width="2" stroke-linecap="round"/>

  <!-- Roller 1: Primary Chill Roller (Spinning CW) -->
  <g class="roller-1">
    <circle cx="120" cy="140" r="34" fill="url(#rollerGradLight)" stroke="#146B44" stroke-width="2"/>
    <!-- Radius spoke lines for visible rotation -->
    <line x1="120" y1="106" x2="120" y2="174" stroke="#146B44" stroke-width="1.5"/>
    <line x1="86" y1="140" x2="154" y2="140" stroke="#146B44" stroke-width="1.5"/>
    <circle cx="120" cy="140" r="10" fill="#FFFFFF" stroke="#52B216" stroke-width="2"/>
    <circle cx="120" cy="116" r="3" fill="#52B216"/>
    <circle cx="120" cy="164" r="3" fill="#146B44"/>
  </g>

  <!-- Roller 2: Nip Pressure Roller (Spinning CCW) -->
  <g class="roller-2">
    <circle cx="170" cy="100" r="24" fill="url(#rollerGradLight)" stroke="#146B44" stroke-width="2"/>
    <line x1="170" y1="76" x2="170" y2="124" stroke="#146B44" stroke-width="1.5"/>
    <line x1="146" y1="100" x2="194" y2="100" stroke="#146B44" stroke-width="1.5"/>
    <circle cx="170" cy="100" r="8" fill="#FFFFFF" stroke="#52B216" stroke-width="1.5"/>
    <circle cx="170" cy="84" r="2.5" fill="#52B216"/>
  </g>

  <!-- Roller 3: Tension Guide Roller (Spinning CW) -->
  <g class="roller-3">
    <circle cx="230" cy="160" r="26" fill="url(#rollerGradLight)" stroke="#146B44" stroke-width="2"/>
    <line x1="230" y1="134" x2="230" y2="186" stroke="#146B44" stroke-width="1.5"/>
    <line x1="204" y1="160" x2="256" y2="160" stroke="#146B44" stroke-width="1.5"/>
    <circle cx="230" cy="160" r="9" fill="#FFFFFF" stroke="#52B216" stroke-width="1.5"/>
    <circle cx="230" cy="142" r="2.5" fill="#52B216"/>
  </g>

  <!-- Corona Treater Unit (Electrostatic Discharge) -->
  <rect x="280" y="65" width="40" height="18" rx="4" fill="#0A221A" stroke="#52B216" stroke-width="1.5"/>
  <text x="300" y="77" font-family="'Space Grotesk', monospace" font-size="7" font-weight="700" fill="#88DE3D" text-anchor="middle">CORONA</text>
  <g class="corona-beam">
    <line x1="288" y1="83" x2="288" y2="98" stroke="#52B216" stroke-width="2" stroke-linecap="round"/>
    <line x1="294" y1="83" x2="294" y2="100" stroke="#88DE3D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="300" y1="83" x2="300" y2="98" stroke="#52B216" stroke-width="2" stroke-linecap="round"/>
    <line x1="306" y1="83" x2="306" y2="100" stroke="#88DE3D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="312" y1="83" x2="312" y2="98" stroke="#52B216" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Roller 4: Corona Grounding Roller (Spinning CCW) -->
  <g class="roller-4">
    <circle cx="300" cy="120" r="24" fill="url(#rollerGradLight)" stroke="#146B44" stroke-width="2"/>
    <line x1="300" y1="96" x2="300" y2="144" stroke="#146B44" stroke-width="1.5"/>
    <line x1="276" y1="120" x2="324" y2="120" stroke="#146B44" stroke-width="1.5"/>
    <circle cx="300" cy="120" r="8" fill="#FFFFFF" stroke="#52B216" stroke-width="1.5"/>
  </g>

  <!-- Base Continuous Film Web Guide Path (Solid underlying base) -->
  <path d="M 70 106 L 95 125 A 34 34 0 0 0 148 152 L 152 118 A 24 24 0 0 1 185 88 L 210 142 A 26 26 0 0 0 250 174 L 285 128 A 24 24 0 0 1 315 102 L 375 140" 
        stroke="rgba(20, 107, 68, 0.25)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Animated Flowing Film Web Stream (Dashed animated layers moving forward) -->
  <path d="M 70 106 L 95 125 A 34 34 0 0 0 148 152 L 152 118 A 24 24 0 0 1 185 88 L 210 142 A 26 26 0 0 0 250 174 L 285 128 A 24 24 0 0 1 315 102 L 375 140" 
        stroke="url(#filmWebLight)" stroke-width="4.5" fill="none" stroke-linecap="round" class="animated-film-path"/>

  <!-- Pulsing High-Speed Molecular Particles along the Film Web -->
  <path d="M 70 106 L 95 125 A 34 34 0 0 0 148 152 L 152 118 A 24 24 0 0 1 185 88 L 210 142 A 26 26 0 0 0 250 174 L 285 128 A 24 24 0 0 1 315 102 L 375 140" 
        stroke="#88DE3D" stroke-width="2.5" fill="none" stroke-linecap="round" class="animated-film-glow"/>

  <!-- Roller 5: Turret Winder Roll (Spinning CW with winding film layer) -->
  <g class="roller-winder">
    <circle cx="410" cy="160" r="44" fill="#F4FAF6" stroke="#146B44" stroke-width="2.2"/>
    <circle cx="410" cy="160" r="38" stroke="#52B216" stroke-width="1.8" fill="none" stroke-dasharray="6 3"/>
    <circle cx="410" cy="160" r="30" fill="#EAF4EE" stroke="#146B44" stroke-width="1.5"/>
    <line x1="410" y1="120" x2="410" y2="200" stroke="#146B44" stroke-width="1.5"/>
    <line x1="370" y1="160" x2="450" y2="160" stroke="#146B44" stroke-width="1.5"/>
    <circle cx="410" cy="160" r="14" fill="#FFFFFF" stroke="#52B216" stroke-width="2"/>
    <circle cx="410" cy="132" r="3.5" fill="#52B216"/>
    <circle cx="438" cy="160" r="3.5" fill="#146B44"/>
  </g>

  <!-- Technical Spec Callouts -->
  <text x="70" y="245" font-family="'Space Grotesk', monospace" font-size="11" fill="#0A221A" font-weight="700">CONTINUOUS MULTI-LAYER FILM WEB</text>
  <text x="70" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#3B584C">Synchronized chill roll calibration, corona bonding &amp; automated winding</text>

  <!-- Active Status Tag with Pulsing Dot -->
  <rect x="24" y="276" width="180" height="26" rx="4" fill="#F4FAF6" stroke="#146B44"/>
  <circle cx="36" cy="289" r="4" fill="#52B216" class="extruder-melt"/>
  <text x="46" y="293" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#146B44">EXTRUSION LINE: ACTIVE</text>
</svg>
