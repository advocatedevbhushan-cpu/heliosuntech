<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="filmWeb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#00B4D8" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#00E599" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" rx="16" fill="#0E1217"/>
  <path d="M 40 0 V 320 M 120 0 V 320 M 200 0 V 320 M 280 0 V 320 M 360 0 V 320 M 440 0 V 320" stroke="#1E2633" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 0 60 H 480 M 0 120 H 480 M 0 180 H 480 M 0 240 H 480" stroke="#1E2633" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- T-Die / Extrusion Film Lip -->
  <polygon points="50,60 90,60 82,100 58,100" fill="#243042" stroke="#00E599" stroke-width="1.8"/>
  <rect x="62" y="100" width="16" height="6" fill="#00E599"/>
  <text x="70" y="50" font-family="'Space Grotesk', monospace" font-size="9" fill="#8E9AA8" text-anchor="middle">T-DIE EXTRUDER</text>

  <!-- Industrial Chill Rollers & Calenders -->
  <!-- Roller 1 (Primary Chill) -->
  <circle cx="120" cy="140" r="32" fill="url(#rollerGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="140" r="10" fill="#0E1217" stroke="#00E599" stroke-width="1.5"/>
  
  <!-- Roller 2 (Nip Roller) -->
  <circle cx="170" cy="100" r="22" fill="url(#rollerGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="170" cy="100" r="7" fill="#0E1217"/>

  <!-- Roller 3 (Tension Guide) -->
  <circle cx="230" cy="160" r="24" fill="url(#rollerGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="230" cy="160" r="8" fill="#0E1217"/>

  <!-- Roller 4 (Corona Treater / Cooling) -->
  <circle cx="300" cy="115" r="22" fill="url(#rollerGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="115" r="7" fill="#0E1217" stroke="#00B4D8" stroke-width="1.5"/>

  <!-- Continuous Plastic Coating Film Web Path -->
  <path d="M 70 106 L 95 125 A 32 32 0 0 0 148 152 L 152 118 A 22 22 0 0 1 185 88 L 210 142 A 24 24 0 0 0 250 174 L 285 128 A 22 22 0 0 1 315 100 L 380 140" 
        stroke="url(#filmWeb)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Surface Glow on Film Web -->
  <path d="M 70 106 L 95 125 A 32 32 0 0 0 148 152 L 152 118 A 22 22 0 0 1 185 88 L 210 142 A 24 24 0 0 0 250 174 L 285 128 A 22 22 0 0 1 315 100 L 380 140" 
        stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-opacity="0.8"/>

  <!-- Turret Winder Roll -->
  <circle cx="410" cy="160" r="42" fill="#1C2430" stroke="#00E599" stroke-width="2"/>
  <circle cx="410" cy="160" r="30" fill="#2D3A4D" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="410" cy="160" r="12" fill="#0E1217"/>
  
  <!-- Film Winding Layer lines -->
  <circle cx="410" cy="160" r="38" stroke="#00E599" stroke-width="1.5" fill="none" stroke-dasharray="2 4"/>

  <!-- Technical Spec Callouts -->
  <text x="70" y="245" font-family="'Space Grotesk', monospace" font-size="11" fill="#F8FAFC" font-weight="700">CONTINUOUS COATING WEB</text>
  <text x="70" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8E9AA8">Precision gauge tolerance, corona treatment &amp; smooth barrier layer</text>

  <rect x="350" y="235" width="115" height="24" rx="4" fill="#161D26" stroke="#00E599"/>
  <text x="407" y="251" font-family="'Space Grotesk', monospace" font-size="9" fill="#00E599" text-anchor="middle">FILM COATING REELS</text>
</svg>
