<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" fill="none">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="540" height="400" rx="16" fill="#0E1217"/>
  <circle cx="270" cy="200" r="140" stroke="#1E293B" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
  <circle cx="270" cy="200" r="115" stroke="#161D26" stroke-width="1" fill="#0B0D0F"/>

  <!-- Orbital Flow Arcs -->
  <path d="M 270 60 A 140 140 0 0 1 410 200" stroke="#00E599" stroke-width="3" fill="none" stroke-dasharray="6 8"/>
  <path d="M 410 200 A 140 140 0 0 1 270 340" stroke="#00B4D8" stroke-width="3" fill="none"/>
  <path d="M 270 340 A 140 140 0 0 1 130 200" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <path d="M 130 200 A 140 140 0 0 1 270 60" stroke="#00E599" stroke-width="3" fill="none"/>

  <!-- Core Hexagon Hub -->
  <polygon points="270,165 300,182 300,218 270,235 240,218 240,182" fill="#161F2A" stroke="#00E599" stroke-width="2"/>
  <text x="270" y="196" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">CIRCULAR</text>
  <text x="270" y="210" font-family="'Space Grotesk', monospace" font-size="9" fill="#00E599" text-anchor="middle">POLYMERS</text>

  <!-- Node 1: Waste Recovery (Top) -->
  <circle cx="270" cy="60" r="22" fill="#121820" stroke="#00E599" stroke-width="2"/>
  <text x="270" y="56" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#00E599" text-anchor="middle">01</text>
  <text x="270" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F8FAFC" text-anchor="middle">RECLAIM</text>
  <text x="270" y="26" font-family="'Space Grotesk', monospace" font-size="11" fill="#F8FAFC" text-anchor="middle" font-weight="600">POST-INDUSTRIAL WASTE</text>

  <!-- Node 2: Processing & Granules (Right) -->
  <circle cx="410" cy="200" r="22" fill="#121820" stroke="#00B4D8" stroke-width="2"/>
  <text x="410" y="196" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#00B4D8" text-anchor="middle">02</text>
  <text x="410" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F8FAFC" text-anchor="middle">REPROCESS</text>
  <text x="450" y="195" font-family="'Space Grotesk', monospace" font-size="10" fill="#F8FAFC" font-weight="600">ENGINEERED</text>
  <text x="450" y="209" font-family="'Space Grotesk', monospace" font-size="10" fill="#00B4D8">GRANULES</text>

  <!-- Node 3: Advanced Manufacturing & Film (Bottom) -->
  <circle cx="270" cy="340" r="22" fill="#121820" stroke="#00E599" stroke-width="2"/>
  <text x="270" y="336" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#00E599" text-anchor="middle">03</text>
  <text x="270" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F8FAFC" text-anchor="middle">RECREATE</text>
  <text x="270" y="380" font-family="'Space Grotesk', monospace" font-size="11" fill="#F8FAFC" text-anchor="middle" font-weight="600">COATING FILM &amp; PRODUCTS</text>

  <!-- Node 4: Industrial Utilization (Left) -->
  <circle cx="130" cy="200" r="22" fill="#121820" stroke="#8E9AA8" stroke-width="2"/>
  <text x="130" y="196" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#8E9AA8" text-anchor="middle">04</text>
  <text x="130" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F8FAFC" text-anchor="middle">RECYCLE</text>
  <text x="75" y="195" font-family="'Space Grotesk', monospace" font-size="10" fill="#F8FAFC" text-anchor="middle" font-weight="600">DOWNSTREAM</text>
  <text x="75" y="209" font-family="'Space Grotesk', monospace" font-size="10" fill="#8E9AA8" text-anchor="middle">CONVERSION</text>
</svg>
